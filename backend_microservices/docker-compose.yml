services:
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    develop:  
      watch:
        - action: sync+restart
          path: ./auth_service        # host folder to watch
          target: /auth_service 
    env_file:
      - ./auth_service/app/.env
    networks:
      - microservices-network

  chat_service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    develop:  
      watch:
        - action: sync+restart
          path: ./chat_service        # host folder to watch
          target: /chat_service 
    env_file:
      - ./chat_service/app/.env
    networks:
      - microservices-network

  course_service:
    build:
      context: ./course_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    develop:  
      watch:
        - action: sync+restart
          path: ./course_service        # host folder to watch
          target: /course_service 
    depends_on:
      - mysql_course
    env_file:
      - ./course_service/app/.env
    networks:
      - microservices-network

  filemanager_service:
    build:
      context: ./filemanager_service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    develop:  
      watch:
        - action: sync+restart
          path: ./filemanager_service        # host folder to watch
          target: /filemanager_service 
    depends_on:
      - mysql_filemanager
    env_file:
      - ./filemanager_service/app/.env
    networks:
      - microservices-network

  genai_service:
    build:
      context: ./genai_service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    develop:  
      watch:
        - action: sync+restart
          path: ./genai_service        # host folder to watch
          target: /genai_service 
    env_file:
      - ./genai_service/app/.env.devel
    networks:
      - microservices-network

  user_service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    develop:  
      watch:
        - action: sync+restart
          path: ./user_service        # host folder to watch
          target: /user_service 
    depends_on:
      - mysql_user
    env_file:
      - ./user_service/app/.env
    networks:
      - microservices-network
  
  skill_tree_service:
    build:
      context: ./skill_tree_service
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    develop:  
      watch:
        - action: sync+restart
          path: ./skill_tree_service        # host folder to watch
          target: /skill_tree_service 
    depends_on:
      - mysql_skilltree
    env_file:
      - ./skill_tree_service/app/.env
    networks:
      - microservices-network

  subscription_service:
    build:
      context: ./subscription_service
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    develop:  
      watch:
        - action: sync+restart
          path: ./subscription_service        # host folder to watch
          target: /subscription_service
    depends_on:
      - mysql_subscription
      - redis
    env_file:
      - ./subscription_service/app/.env
    networks:
      - microservices-network

  # MySQL containers.
  mysql_chat:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_chat
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3307:3306"
    volumes:
      - db_chat:/var/lib/mysql
    networks:
      - microservices-network

  mysql_course:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_course
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3308:3306"
    volumes:
      - db_course:/var/lib/mysql
    networks:
      - microservices-network

  mysql_user:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_user
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3309:3306"
    volumes:
      - db_user:/var/lib/mysql
    networks:
      - microservices-network
  
  mysql_filemanager:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_files
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3310:3306"
    volumes:
      - db_filemanager:/var/lib/mysql
    networks:
      - microservices-network
  
  mysql_skilltree:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_skilltree
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3311:3306"
    volumes:
      - db_skilltree:/var/lib/mysql
    networks:
      - microservices-network
  
  mysql_subscription:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: edux_subscription
      MYSQL_USER: edux_admin
      MYSQL_PASSWORD: eduxisawesome123
      MYSQL_ROOT_PASSWORD: 22003206
    ports:
      - "3312:3306"
    volumes:
      - db_subscription:/var/lib/mysql
    networks:
      - microservices-network
  
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: always
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  db_chat:
  db_course:
  db_filemanager:
  db_user:
  db_skilltree:
  db_subscription: